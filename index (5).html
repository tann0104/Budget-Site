<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>よりみち家計簿</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f2;
      --surface: #fff;
      --ink: #292b28;
      --muted: #8b8d85;
      --line: #eeede8;
      --green: #6a8f72;
      --green-soft: #edf4ed;
      --red: #d77969;
      --red-soft: #fbefec;
      --yellow: #f3c878;
      --shadow: 0 12px 36px rgba(49, 52, 42, .055);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(243, 200, 120, .12), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 15px;
      background: var(--green);
      color: white;
      font-size: 21px;
      box-shadow: 0 7px 16px rgba(106, 143, 114, .22);
    }

    .brand-name {
      margin: 0;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.04em;
    }

    .brand-caption {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .storage-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #e8e7e0;
      border-radius: 999px;
      padding: 9px 13px;
      color: #777a71;
      background: rgba(255,255,255,.65);
      font-size: 11px;
    }

    .storage-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #83a98a;
    }

    .welcome {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 23px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 32px);
      letter-spacing: -.06em;
      line-height: 1.35;
    }

    .welcome-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .month-picker {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: white;
    }

    .month-picker button {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 10px;
      color: #66695f;
      background: transparent;
      font-size: 20px;
      transition: background .2s, color .2s;
    }

    .month-picker button:hover {
      background: var(--green-soft);
      color: var(--green);
    }

    .month-label {
      min-width: 90px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      min-height: 138px;
      padding: 21px 23px;
      border: 1px solid rgba(238,237,232,.9);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .summary-card::after {
      position: absolute;
      right: -24px;
      bottom: -44px;
      width: 112px;
      height: 112px;
      border: 20px solid rgba(106,143,114,.055);
      border-radius: 50%;
      content: "";
    }

    .summary-card.expense::after { border-color: rgba(215,121,105,.07); }
    .summary-card.balance::after { border-color: rgba(243,200,120,.12); }

    .summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .summary-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .summary-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--green-soft);
      font-size: 14px;
    }

    .expense .summary-icon { background: var(--red-soft); }
    .balance .summary-icon { background: #fff6e5; }

    .summary-amount {
      margin: 0;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 750;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }

    .summary-amount small {
      margin-left: 3px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .summary-hint {
      margin: 6px 0 0;
      color: #a0a198;
      font-size: 11px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(290px, .9fr);
      gap: 20px;
      align-items: start;
    }

    .left-column, .right-column {
      display: grid;
      gap: 20px;
    }

    .panel {
      border: 1px solid rgba(238,237,232,.9);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 21px 23px 15px;
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.03em;
    }

    .panel-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .transaction-count {
      color: #a0a198;
      font-size: 11px;
      white-space: nowrap;
    }

    .transaction-list {
      padding: 0 23px 9px;
    }

    .transaction {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #f3f2ee;
    }

    .transaction:last-child { border-bottom: 0; }

    .category-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 14px;
      background: #f5f4ef;
      font-size: 19px;
    }

    .transaction-info { min-width: 0; flex: 1; }

    .transaction-name {
      overflow: hidden;
      margin: 0;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .transaction-meta {
      margin: 5px 0 0;
      color: #a0a198;
      font-size: 10px;
    }

    .transaction-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .transaction-amount {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .transaction-amount.income { color: var(--green); }
    .transaction-amount.expense { color: var(--ink); }

    .delete-button {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #b7b8b1;
      font-size: 16px;
      opacity: 0;
      transition: .18s ease;
    }

    .transaction:hover .delete-button,
    .delete-button:focus-visible { opacity: 1; }

    .delete-button:hover {
      background: var(--red-soft);
      color: var(--red);
    }

    .empty-state {
      padding: 28px 10px 34px;
      color: var(--muted);
      text-align: center;
    }

    .empty-illustration {
      display: grid;
      place-items: center;
      width: 55px;
      height: 55px;
      margin: 0 auto 12px;
      border-radius: 19px;
      background: #f5f4ef;
      font-size: 24px;
    }

    .empty-state p { margin: 0; font-size: 12px; }
    .empty-state p + p { margin-top: 5px; font-size: 11px; color: #a0a198; }

    .form-panel { padding-bottom: 21px; }

    .form-panel .panel-heading { padding-bottom: 17px; }

    .type-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 0 22px 18px;
      padding: 4px;
      border-radius: 13px;
      background: #f5f4f0;
    }

    .type-button {
      border: 0;
      border-radius: 10px;
      padding: 9px;
      color: #92948c;
      background: transparent;
      font-size: 12px;
      font-weight: 650;
      transition: .2s ease;
    }

    .type-button.active.expense {
      color: var(--red);
      background: white;
      box-shadow: 0 2px 8px rgba(40,40,30,.06);
    }

    .type-button.active.income {
      color: var(--green);
      background: white;
      box-shadow: 0 2px 8px rgba(40,40,30,.06);
    }

    .form-fields { padding: 0 22px; }

    .field { margin-bottom: 13px; }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #777a71;
      font-size: 11px;
      font-weight: 650;
    }

    .input-wrap { position: relative; }

    .field input, .field select {
      width: 100%;
      height: 42px;
      border: 1px solid #eeede8;
      border-radius: 12px;
      outline: none;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      transition: border-color .2s, box-shadow .2s;
    }

    .field input:focus, .field select:focus {
      border-color: #9bb19d;
      box-shadow: 0 0 0 3px rgba(106,143,114,.1);
    }

    .amount-input { padding-right: 36px !important; }
    .yen-symbol {
      position: absolute;
      top: 50%;
      right: 13px;
      color: #a0a198;
      font-size: 12px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: calc(100% - 44px);
      height: 44px;
      margin: 5px 22px 0;
      border: 0;
      border-radius: 13px;
      color: white;
      background: var(--green);
      box-shadow: 0 6px 14px rgba(106,143,114,.2);
      font-size: 12px;
      font-weight: 700;
      transition: transform .16s, background .16s;
    }

    .submit-button:hover { background: #587d61; transform: translateY(-1px); }
    .submit-button:active { transform: translateY(0); }

    .category-panel { padding-bottom: 20px; }

    .category-content {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 3px 23px 0;
    }

    .donut {
      display: grid;
      place-items: center;
      width: 118px;
      height: 118px;
      flex-shrink: 0;
      border-radius: 50%;
      background: conic-gradient(#e9e8e1 0deg 360deg);
    }

    .donut-hole {
      display: grid;
      place-content: center;
      width: 79px;
      height: 79px;
      border-radius: 50%;
      background: white;
      text-align: center;
    }

    .donut-hole strong {
      font-size: 14px;
      letter-spacing: -.04em;
    }

    .donut-hole span {
      margin-top: 3px;
      color: #a0a198;
      font-size: 9px;
    }

    .category-legend {
      display: grid;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 10px;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
    }

    .legend-name {
      overflow: hidden;
      color: #73766e;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend-value {
      margin-left: auto;
      color: #92948c;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .category-empty {
      width: 100%;
      color: #a0a198;
      font-size: 11px;
      line-height: 1.8;
      text-align: center;
    }

    .footer-note {
      margin-top: 22px;
      color: #aaa99f;
      font-size: 10px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .app { width: min(100% - 28px, 560px); padding-top: 23px; }
      .topbar { margin-bottom: 28px; }
      .welcome { align-items: start; flex-direction: column; }
      .month-picker { align-self: stretch; justify-content: space-between; }
      .summary-grid { gap: 9px; }
      .summary-card { min-height: 119px; padding: 16px 13px; border-radius: 18px; }
      .summary-top { margin-bottom: 11px; }
      .summary-title { font-size: 10px; }
      .summary-icon { width: 26px; height: 26px; font-size: 12px; }
      .summary-amount { font-size: clamp(17px, 5vw, 23px); }
      .summary-hint { font-size: 9px; }
      .content-grid { grid-template-columns: 1fr; }
      .right-column { grid-row: 1; }
      .left-column { grid-row: 2; }
      .form-panel { order: -1; }
      .category-content { justify-content: center; }
      .delete-button { opacity: 1; }
    }

    @media (max-width: 390px) {
      .storage-badge { padding: 8px 10px; font-size: 10px; }
      .brand-caption { font-size: 10px; }
      .category-content { gap: 13px; padding-right: 15px; padding-left: 15px; }
      .donut { width: 105px; height: 105px; }
      .donut-hole { width: 71px; height: 71px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⌂</div>
        <div>
          <p class="brand-name">よりみち家計簿</p>
          <p class="brand-caption">毎日の暮らしを、やさしく記録。</p>
        </div>
      </div>
      <div class="storage-badge">
        <span class="storage-dot" aria-hidden="true"></span>
        この端末に保存中
      </div>
    </header>

    <section class="welcome">
      <div>
        <p class="eyebrow">YOUR MONEY, YOUR PACE</p>
        <h1>お金の流れを、<br>心地よく整えよう。</h1>
        <p class="welcome-note">今月の収支を、ひと目でチェック。</p>
      </div>
      <div class="month-picker" aria-label="表示する月">
        <button id="prevMonth" type="button" aria-label="前の月">‹</button>
        <span class="month-label" id="monthLabel"></span>
        <button id="nextMonth" type="button" aria-label="次の月">›</button>
      </div>
    </section>

    <section class="summary-grid" aria-label="今月の収支">
      <article class="summary-card balance">
        <div class="summary-top">
          <span class="summary-title">今月の収支</span>
          <span class="summary-icon" aria-hidden="true">✦</span>
        </div>
        <p class="summary-amount" id="balanceAmount">¥0<small></small></p>
        <p class="summary-hint">収入 − 支出</p>
      </article>
      <article class="summary-card income">
        <div class="summary-top">
          <span class="summary-title">今月の収入</span>
          <span class="summary-icon" aria-hidden="true">↗</span>
        </div>
        <p class="summary-amount" id="incomeAmount">¥0<small></small></p>
        <p class="summary-hint">入ってきたお金</p>
      </article>
      <article class="summary-card expense">
        <div class="summary-top">
          <span class="summary-title">今月の支出</span>
          <span class="summary-icon" aria-hidden="true">↘</span>
        </div>
        <p class="summary-amount" id="expenseAmount">¥0<small></small></p>
        <p class="summary-hint">使ったお金</p>
      </article>
    </section>

    <div class="content-grid">
      <div class="left-column">
        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2 class="panel-title">最近の記録</h2>
              <p class="panel-subtitle">選択した月の入出金</p>
            </div>
            <span class="transaction-count" id="transactionCount">0件</span>
          </div>
          <div class="transaction-list" id="transactionList"></div>
        </section>

        <section class="panel category-panel">
          <div class="panel-heading">
            <div>
              <h2 class="panel-title">支出の内訳</h2>
              <p class="panel-subtitle">どんなことに使ったかな？</p>
            </div>
          </div>
          <div class="category-content">
            <div class="donut" id="donut">
              <div class="donut-hole">
                <strong id="donutTotal">¥0</strong>
                <span>今月の支出</span>
              </div>
            </div>
            <div class="category-legend" id="categoryLegend"></div>
          </div>
        </section>
      </div>

      <div class="right-column">
        <section class="panel form-panel">
          <div class="panel-heading">
            <div>
              <h2 class="panel-title">新しく記録</h2>
              <p class="panel-subtitle">あとから編集・削除もできます</p>
            </div>
          </div>

          <div class="type-switch" role="group" aria-label="記録の種類">
            <button class="type-button active expense" id="expenseType" type="button">− 支出</button>
            <button class="type-button income" id="incomeType" type="button">＋ 収入</button>
          </div>

          <form id="entryForm">
            <div class="form-fields">
              <div class="field">
                <label for="amount">金額</label>
                <div class="input-wrap">
                  <input class="amount-input" id="amount" name="amount" type="number"
                    min="1" step="1" placeholder="例：1,200" required>
                  <span class="yen-symbol">円</span>
                </div>
              </div>

              <div class="field">
                <label for="memo">内容</label>
                <input id="memo" name="memo" type="text" maxlength="40"
                  placeholder="例：スーパーで買い物" required>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="category">カテゴリ</label>
                  <select id="category" name="category"></select>
                </div>
                <div class="field">
                  <label for="date">日付</label>
                  <input id="date" name="date" type="date" required>
                </div>
              </div>
            </div>
            <button class="submit-button" type="submit"><span aria-hidden="true">＋</span> 記録を追加</button>
          </form>
        </section>
      </div>
    </div>

    <p class="footer-note">記録はこのブラウザー内に保存されます。端末やブラウザーを変更すると引き継がれません。</p>
  </main>

  <script>
    const STORAGE_KEY = "yorimichi-kakeibo-v1";

    const categories = {
      expense: [
        { name: "食費", icon: "🍚" },
        { name: "日用品", icon: "🧺" },
        { name: "交通費", icon: "🚃" },
        { name: "趣味・娯楽", icon: "🎨" },
        { name: "美容・健康", icon: "🌿" },
        { name: "住まい", icon: "🏠" },
        { name: "その他", icon: "☁️" }
      ],
      income: [
        { name: "給与", icon: "💼" },
        { name: "臨時収入", icon: "🎁" },
        { name: "副収入", icon: "✨" },
        { name: "その他", icon: "☁️" }
      ]
    };

    const chartColors = ["#78977a", "#edbc68", "#e58d79", "#8ba6c1", "#b39ac3", "#9eb8ac", "#c5bd9d"];
    const list = document.getElementById("transactionList");
    const form = document.getElementById("entryForm");
    const categorySelect = document.getElementById("category");
    const expenseTypeButton = document.getElementById("expenseType");
    const incomeTypeButton = document.getElementById("incomeType");

    let entries = loadEntries();
    let currentType = "expense";
    const now = new Date();
    let displayedMonth = new Date(now.getFullYear(), now.getMonth(), 1);

    function loadEntries() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveEntries() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function formatYen(value) {
      return "¥" + Math.round(value).toLocaleString("ja-JP");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function monthKey(date) {
      return date.slice(0, 7);
    }

    function entriesForMonth() {
      const key = `${displayedMonth.getFullYear()}-${String(displayedMonth.getMonth() + 1).padStart(2, "0")}`;
      return entries.filter(entry => entry.date && monthKey(entry.date) === key);
    }

    function getCategoryIcon(type, category) {
      return categories[type]?.find(item => item.name === category)?.icon || "☁️";
    }

    function setType(type) {
      currentType = type;
      expenseTypeButton.classList.toggle("active", type === "expense");
      incomeTypeButton.classList.toggle("active", type === "income");
      expenseTypeButton.setAttribute("aria-pressed", String(type === "expense"));
      incomeTypeButton.setAttribute("aria-pressed", String(type === "income"));

      categorySelect.innerHTML = categories[type]
        .map(item => `<option value="${escapeHtml(item.name)}">${item.icon} ${escapeHtml(item.name)}</option>`)
        .join("");

      document.querySelector(".submit-button").style.background =
        type === "income" ? "var(--green)" : "";
    }

    function renderSummary(monthEntries) {
      const income = monthEntries
        .filter(entry => entry.type === "income")
        .reduce((sum, entry) => sum + Number(entry.amount || 0), 0);
      const expense = monthEntries
        .filter(entry => entry.type === "expense")
        .reduce((sum, entry) => sum + Number(entry.amount || 0), 0);
      const balance = income - expense;

      document.getElementById("incomeAmount").innerHTML = `${formatYen(income)}<small></small>`;
      document.getElementById("expenseAmount").innerHTML = `${formatYen(expense)}<small></small>`;
      document.getElementById("balanceAmount").innerHTML =
        `${balance < 0 ? "−" : ""}${formatYen(Math.abs(balance))}<small></small>`;
      document.getElementById("balanceAmount").style.color =
        balance < 0 ? "var(--red)" : "var(--ink)";
    }

    function renderTransactions(monthEntries) {
      const sorted = [...monthEntries].sort((a, b) => {
        return b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0);
      });

      document.getElementById("transactionCount").textContent = `${sorted.length}件`;

      if (!sorted.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-illustration" aria-hidden="true">🌱</div>
            <p>この月の記録はまだありません</p>
            <p>右側のフォームから、最初の記録を追加してみましょう。</p>
          </div>`;
        return;
      }

      list.innerHTML = sorted.map(entry => {
        const isIncome = entry.type === "income";
        const dateLabel = new Date(`${entry.date}T00:00:00`).toLocaleDateString("ja-JP", {
          month: "numeric", day: "numeric", weekday: "short"
        });
        return `
          <article class="transaction">
            <div class="category-icon" aria-hidden="true">${getCategoryIcon(entry.type, entry.category)}</div>
            <div class="transaction-info">
              <p class="transaction-name">${escapeHtml(entry.memo)}</p>
              <p class="transaction-meta">${escapeHtml(entry.category)} ・ ${dateLabel}</p>
            </div>
            <div class="transaction-right">
              <span class="transaction-amount ${isIncome ? "income" : "expense"}">
                ${isIncome ? "+" : "−"}${formatYen(Number(entry.amount))}
              </span>
              <button class="delete-button" type="button" data-delete="${escapeHtml(entry.id)}"
                aria-label="${escapeHtml(entry.memo)}を削除">×</button>
            </div>
          </article>`;
      }).join("");
    }

    function renderCategories(monthEntries) {
      const expenseEntries = monthEntries.filter(entry => entry.type === "expense");
      const totals = new Map();

      expenseEntries.forEach(entry => {
        totals.set(entry.category, (totals.get(entry.category) || 0) + Number(entry.amount || 0));
      });

      const sorted = [...totals.entries()].sort((a, b) => b[1] - a[1]);
      const total = sorted.reduce((sum, item) => sum + item[1], 0);
      document.getElementById("donutTotal").textContent = formatYen(total);

      const donut = document.getElementById("donut");
      const legend = document.getElementById("categoryLegend");

      if (!total) {
        donut.style.background = "conic-gradient(#e9e8e1 0deg 360deg)";
        legend.innerHTML = `<div class="category-empty">支出を記録すると<br>ここに内訳が表示されます</div>`;
        return;
      }

      let currentDegree = 0;
      const segments = sorted.map(([, amount], index) => {
        const start = currentDegree;
        currentDegree += amount / total * 360;
        return `${chartColors[index % chartColors.length]} ${start}deg ${currentDegree}deg`;
      });
      donut.style.background = `conic-gradient(${segments.join(", ")})`;

      legend.innerHTML = sorted.slice(0, 5).map(([name, amount], index) => `
        <div class="legend-item">
          <span class="legend-dot" style="background:${chartColors[index % chartColors.length]}"></span>
          <span class="legend-name">${escapeHtml(name)}</span>
          <span class="legend-value">${Math.round(amount / total * 100)}%</span>
        </div>`).join("");
    }

    function render() {
      const monthEntries = entriesForMonth();
      document.getElementById("monthLabel").textContent =
        `${displayedMonth.getFullYear()}年 ${displayedMonth.getMonth() + 1}月`;
      renderSummary(monthEntries);
      renderTransactions(monthEntries);
      renderCategories(monthEntries);
    }

    expenseTypeButton.addEventListener("click", () => setType("expense"));
    incomeTypeButton.addEventListener("click", () => setType("income"));

    document.getElementById("prevMonth").addEventListener("click", () => {
      displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() - 1, 1);
      render();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + 1, 1);
      render();
    });

    form.addEventListener("submit", event => {
      event.preventDefault();

      const amount = Number(form.elements.amount.value);
      const memo = form.elements.memo.value.trim();
      const date = form.elements.date.value;

      if (!Number.isFinite(amount) || amount <= 0 || !memo || !date) return;

      entries.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        type: currentType,
        amount,
        memo,
        category: categorySelect.value,
        date,
        createdAt: Date.now()
      });

      saveEntries();
      form.reset();
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      render();
      document.getElementById("amount").focus();
    });

    list.addEventListener("click", event => {
      const button = event.target.closest("[data-delete]");
      if (!button) return;

      entries = entries.filter(entry => entry.id !== button.dataset.delete);
      saveEntries();
      render();
    });

    document.getElementById("date").value = new Date().toISOString().slice(0, 10);
    setType("expense");
    render();
  </script>
</body>
</html>
